# Вариант для VPS за пределами РФ с nginx (нужен домен и сертификат, например tg-relay.example.com).
server {
    listen 443 ssl;
    server_name tg-relay.example.com;
    ssl_certificate     /etc/letsencrypt/live/tg-relay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tg-relay.example.com/privkey.pem;

    location ~ ^/(file/)?bot {
        if ($http_x_relay_key != "ЗАМЕНИТЕ_НА_СЕКРЕТ") { return 403; }
        proxy_pass https://api.telegram.org;
        proxy_ssl_server_name on;
        proxy_set_header Host api.telegram.org;
        proxy_set_header X-Relay-Key "";
        client_max_body_size 25m;
        proxy_read_timeout 60s;
    }
    location / { return 404; }
}
